apiVersion: v1
kind: Namespace
metadata:
  name: cs554-midterm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cs554-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs554-web
  template:
    metadata:
      labels:
        app: cs554-web
    spec:
      containers:
        - name: web
          image: cs554-service:1.0
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: cs554-service
            - name: MESSAGE
              value: Hello from Kubernetes
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cs554-midterm
spec:
  selector:
    app: cs554-web
  ports:
    - name: http
      port: 80
      targetPort: http
